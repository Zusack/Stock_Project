[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analyzer"
version = "0.2.0"
description = "Stock analysis desktop app (Flet UI + SQLite market data)."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "flet==0.85.1",
    "flet-charts==0.85.1",
    "darkdetect>=0.8.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*"]
